name: Run Oslo Quant

on:
  # Manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to run (space-separated, e.g. TEL.OL MOWI.OL). Leave blank for all 17; partial runs still require 14 qualified companies to publish."
        required: false
        default: ""
      frameworks:
        description: "Frameworks to run (dupont piotroski sloan ohlson altman). Leave blank for all 5."
        required: false
        default: ""
      force_refresh:
        description: "Compatibility input; publication always forces source retrieval"
        required: false
        default: "false"
        type: boolean

  # Automatic weekly run — every Friday at 17:00 UTC, after Oslo Børs close.
  # GitHub cron is fixed UTC and does not follow DST, so this lands at
  # 19:00 CEST (summer) / 18:00 CET (winter). Oslo Børs closing auction ends
  # ~16:25 local, so the day's closing prices are always settled by then.
  # Deliberately not on the hour: GitHub deprioritises scheduled jobs under load
  # and the top of the hour is the most contended slot (the previous 06:00 cron
  # consistently fired 3-6 hours late).
  schedule:
    - cron: "17 17 * * 5"

concurrency:
  group: oslo-quant-publish
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit results back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache raw financial data
        uses: actions/cache@v4
        with:
          path: data/raw
          # Refresh cache weekly (keyed on the ISO week number)
          key: raw-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: raw-data-${{ runner.os }}-

      - name: Install oslo-quant
        run: pip install -e .

      - name: Run oslo-quant
        id: publish
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          RUN_TICKERS: ${{ github.event.inputs.tickers }}
          RUN_FRAMEWORKS: ${{ github.event.inputs.frameworks }}
        # The publisher stages outputs and preserves the last report on failed validation.
        continue-on-error: true
        run: |
          ARGS=()
          if [ -n "$RUN_TICKERS" ]; then
            read -r -a TICKERS <<< "$RUN_TICKERS"
            ARGS+=(--tickers "${TICKERS[@]}")
          fi
          if [ -n "$RUN_FRAMEWORKS" ]; then
            read -r -a FRAMEWORKS <<< "$RUN_FRAMEWORKS"
            ARGS+=(--frameworks "${FRAMEWORKS[@]}")
          fi
          python -m oslo_quant.publish "${ARGS[@]}"

      - name: Commit results and report back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/results/ index.html health.json
          else
            git add health.json
          fi
          git diff --staged --quiet || git commit -m "Update results and report [$(date -u +%Y-%m-%d)]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail the run when publication was blocked
        if: steps.publish.outcome != 'success'
        run: exit 1
